[project]
name = "rag-papeer"
version = "0.1.0"
description = "Papeer - Research Paper Assistant with LangGraph and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-classic>=1.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-prebuilt>=0.1.0",
    "langchain-qdrant>=0.1.0",
    "qdrant-client>=1.10.0",
    "pymupdf>=1.24.0",
    "tavily-python>=0.4.0",
    "python-dotenv>=1.0.0",
    "deepeval>=1.0.0",
    "pydantic>=2.7.0",
]
